<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">CueG Lab: a gold C and white G share a stroke to form QG</title>
  <rect width="64" height="64" rx="12" fill="#142d40"/>
  <g fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter">
    <!-- G's left stroke closes the gold C; the diagonal completes Q. -->
    <path d="M34 21 C25 14 10 17 10 32 C10 47 25 50 34 43" stroke="#e3b957"/>
    <path d="M54 21 C46 14 32 17 32 32 C32 47 46 50 54 43 L54 33 L46 33" stroke="#faf9f6"/>
    <path d="M25 38 L35 48" stroke="#e3b957"/>
  </g>
</svg>
